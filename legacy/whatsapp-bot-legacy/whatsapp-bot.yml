name: SABIÁ · Boletim WhatsApp Diário

on:
  schedule:
    # 06:00 e 18:00 Horário de Brasília (09:00 e 21:00 UTC)
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo de Boletim para Disparar'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - manha
          - tarde
          - teste

jobs:
  enviar-boletim:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Disparo do Boletim para o Grupo
        env:
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          TIPO_INPUT: ${{ inputs.tipo }}
        run: |
          if [ "$TIPO_INPUT" = "teste" ]; then
            node pro-duo-main/bot/bot-whatsapp.js --teste
          elif [ "$TIPO_INPUT" = "manha" ]; then
            node pro-duo-main/bot/bot-whatsapp.js --manha
          elif [ "$TIPO_INPUT" = "tarde" ]; then
            node pro-duo-main/bot/bot-whatsapp.js --tarde
          else
            HORA_UTC=$(date -u +%H)
            if [ "$HORA_UTC" -lt "15" ]; then
              node pro-duo-main/bot/bot-whatsapp.js --manha
            else
              node pro-duo-main/bot/bot-whatsapp.js --tarde
            fi
          fi
