; ==============================================================================
; 🌱 Irriga.ai Pro-Duo — Configuração PlatformIO para ESP32-WROOM-32D (38 Pinos V4)
; ==============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Bibliotecas padrão para Display OLED SSD1306 I2C e manipulação de JSON do IrrigaPlan
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    bblanchon/ArduinoJson @ ^7.0.4
