<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🛠️ Irriga.ai Pro-Duo — DEV-GUI (Bancada de Engenharia & Simulador)</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
  <script>
    // Define o modo de Bancada de Desenvolvimento & Simulador Completo
    window.IRRIGA_GUI_MODE = "DEV_GUI";
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Banner Flutuante de Notificação Humana (Toast) -->
  <div id="toast-banner" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-indigo-600 text-white text-xs sm:text-sm font-bold shadow-2xl border border-indigo-300/40 max-w-md text-center transition-all"></div>

  <!-- Container de Modais e Action Sheets iOS -->
  <div id="ios-modal-root"></div>

  <!-- Input Oculto para Upload Direto de Arquivo .YAML Recebido do Claude -->
  <input id="hidden-yaml-file-input" type="file" accept=".yaml,.yml,.txt" class="hidden" onchange="handleYamlFileUpload(event)" />

  <!-- Container Principal Renderizado pelo Motor Pro-Duo (Modo DEV_GUI) -->
  <main id="app-container"></main>

  <script src="./app.js"></script>
</body>
</html>
