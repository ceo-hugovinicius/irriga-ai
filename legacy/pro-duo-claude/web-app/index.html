<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Irriga.ai</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <meta name="theme-color" content="#F4F6F3" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Irriga.ai" />
  <!-- Sem CDN: tudo local para abrir 100% offline na roça -->
  <style>
    :root {
      --bg: #F4F6F3; --card: #FFFFFF; --line: #E3E8E2; --sub: #F7F9F6;
      --ink: #0B1A12; --ink2: #2F3E35; --mute: #5F6F66;
      --green: #0E7A4B; --green-bg: #E3F4EA; --blue: #0362A0; --blue-bg: #E2F0FB;
      --amber: #9A5B00; --amber-bg: #FFF2D6; --red: #B42318; --red-bg: #FDE7E5;
      --violet: #5B3CC4; --violet-bg: #EEE9FD;
      --radius: 20px; --shadow: 0 1px 2px rgba(11,26,18,.05), 0 8px 24px -12px rgba(11,26,18,.12);
    }
    html.dark {
      --bg: #0B120E; --card: #131C17; --line: #24312A; --sub: #18231D;
      --ink: #F2F7F3; --ink2: #C9D6CE; --mute: #8FA197;
      --green-bg: #12301F; --blue-bg: #0F2638; --amber-bg: #33260B; --red-bg: #3A1512; --violet-bg: #231B40;
      --green: #4ADE9B; --blue: #5AB4F5; --amber: #F5B84A; --red: #F98C82; --violet: #B4A2FF;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; letter-spacing: -.01em; padding-bottom: env(safe-area-inset-bottom); }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    input, select, textarea { font: inherit; color: var(--ink); background: var(--sub); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
    h1, h2, h3, p { margin: 0; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 12px 14px 40px; }
    @media (min-width: 1100px) {
      .wrap { max-width: 1320px; }
      .grid { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 16px; align-items: start; }
      .col { display: flex; flex-direction: column; gap: 16px; }
      .only-mobile { display: none !important; }
    }
    @media (max-width: 1099px) { .col { display: contents; } .grid { display: flex; flex-direction: column; gap: 14px; } .only-desktop { display: none !important; } }
    header.top { display: flex; align-items: center; gap: 10px; padding: 6px 2px 12px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
    header.top .brand { font-weight: 800; font-size: 20px; }
    header.top .site { color: var(--mute); font-size: 13px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: var(--sub); border: 1px solid var(--line); white-space: nowrap; }
    .pill.green { background: var(--green-bg); color: var(--green); border-color: transparent; }
    .pill.blue { background: var(--blue-bg); color: var(--blue); border-color: transparent; }
    .pill.amber { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
    .pill.red { background: var(--red-bg); color: var(--red); border-color: transparent; }
    .pill.violet { background: var(--violet-bg); color: var(--violet); border-color: transparent; }
    .iconbtn { width: 42px; height: 42px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 18px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); font-weight: 750; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .hero { padding: 18px; }
    .hero .big { font-size: 22px; font-weight: 750; line-height: 1.25; }
    .hero .small { color: var(--ink2); margin-top: 6px; font-size: 15px; }
    .row { display: flex; gap: 10px; align-items: center; }
    .between { justify-content: space-between; }
    .mute { color: var(--mute); } .ink2 { color: var(--ink2); }
    .t12 { font-size: 12.5px; } .t14 { font-size: 14px; } .b { font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .stat { background: var(--sub); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
    .stat .v { font-size: 19px; font-weight: 800; } .stat .l { font-size: 12px; color: var(--mute); }
    .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .act { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: var(--shadow); min-height: 92px; transition: transform .12s; }
    .act:active { transform: scale(.95); }
    .act .e { font-size: 26px; } .act .n { font-size: 12.5px; font-weight: 700; text-align: center; line-height: 1.15; }
    .act .s { font-size: 11px; color: var(--mute); text-align: center; }
    .act.on { background: var(--blue-bg); border-color: var(--blue); }
    .act.warn { background: var(--amber-bg); border-color: var(--amber); }
    .zone .head { display: flex; gap: 12px; align-items: center; }
    .zone .emoji { font-size: 34px; width: 52px; height: 52px; border-radius: 16px; background: var(--sub); display: grid; place-items: center; }
    .zone .name { font-weight: 800; font-size: 18px; }
    .phases { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 12px 0 4px; }
    .phases i { height: 6px; border-radius: 4px; background: var(--line); }
    .phases i.done { background: var(--green); opacity: .45; } .phases i.now { background: var(--green); }
    .phases i.now.crit { background: var(--violet); }
    .soil { margin-top: 12px; }
    .soilbar { position: relative; height: 16px; border-radius: 10px; background: var(--red-bg); overflow: hidden; border: 1px solid var(--line); }
    .soilbar .ok { position: absolute; top: 0; bottom: 0; right: 0; background: var(--green-bg); }
    .soilbar .fill { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 8px; background: linear-gradient(90deg, #2B8FD6, #0362A0); }
    .soilbar .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink2); }
    .next { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--sub); border: 1px solid var(--line); }
    .why { font-size: 13px; color: var(--ink2); margin-top: 6px; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
    .week .d { font-size: 12px; color: var(--mute); font-weight: 650; }
    .week .barbox { height: 70px; display: flex; align-items: flex-end; justify-content: center; margin: 4px 0; }
    .week .bar { width: 70%; border-radius: 6px 6px 3px 3px; background: var(--blue); min-height: 3px; }
    .week .bar.z0 { background: var(--line); }
    .alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 14px; margin-top: 8px; font-size: 14px; }
    .alert .ic { font-size: 18px; } .alert.info { background: var(--blue-bg); } .alert.warn { background: var(--amber-bg); } .alert.bad { background: var(--red-bg); } .alert.good { background: var(--green-bg); } .alert.tip { background: var(--violet-bg); }
    .alert button.link { color: var(--blue); font-weight: 700; padding: 0; margin-top: 4px; }
    .btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; padding: 12px 16px; border-radius: 14px; font-weight: 700; background: var(--sub); border: 1px solid var(--line); }
    .btn.primary { background: var(--green); color: #fff; border-color: transparent; }
    html.dark .btn.primary { color: #06150D; }
    .btn.blue { background: var(--blue); color: #fff; border-color: transparent; }
    .btn.danger { background: var(--red-bg); color: var(--red); border-color: transparent; }
    .btn.full { width: 100%; } .btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--sub); font-size: 14px; font-weight: 600; }
    .chip.sel { background: var(--green); color: #fff; border-color: var(--green); }
    .list > * + * { border-top: 1px solid var(--line); }
    .li { padding: 10px 0; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
    .timeline { position: relative; }
    .tl-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; }
    .tl-track { position: relative; height: 22px; background: var(--sub); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
    .tl-seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; overflow: hidden; white-space: nowrap; }
    .tl-today { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--red); }
    .relays { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .relay { padding: 8px; border-radius: 12px; background: var(--sub); border: 1px solid var(--line); font-size: 11.5px; text-align: center; }
    .relay.on { background: var(--green-bg); border-color: var(--green); }
    .relay.off-hw { opacity: .55; }
    /* Sheet (modal inferior) */
    .scrim { position: fixed; inset: 0; background: rgba(5,12,8,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
    @media (min-width: 760px) { .scrim { align-items: center; } }
    .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); animation: up .22s cubic-bezier(.2,.9,.3,1); }
    @media (min-width: 760px) { .sheet { border-radius: 24px; } }
    .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: -6px auto 12px; }
    .sheet h3 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .field { margin-top: 12px; } .field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink2); margin-bottom: 6px; }
    .seg { display: flex; background: var(--sub); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
    .seg button { flex: 1; padding: 9px 6px; border-radius: 9px; font-weight: 700; font-size: 14px; }
    .seg button.sel { background: var(--card); box-shadow: var(--shadow); color: var(--green); }
    .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: #0B1A12; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 650; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: 92vw; text-align: center; animation: up .2s; }
    @keyframes up { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    .toast { animation: none; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .live { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .locked-note { font-size: 13px; color: var(--amber); background: var(--amber-bg); padding: 8px 12px; border-radius: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <main id="app" class="wrap"></main>
  <div id="modal"></div>
  <input id="yaml-file" type="file" accept=".yaml,.yml,.txt" hidden />
  <script src="../core/crops.js"></script>
  <script src="../core/irriga-core.js"></script>
  <script src="../core/yaml-lite.js"></script>
  <script src="./app.js"></script>
  <script src="./sheets.js"></script>
</body>
</html>
